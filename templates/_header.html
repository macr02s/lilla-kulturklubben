<header class="wrap site-header{% if club_member %} site-header--signed-in{% endif %}">
  <div class="header-brand">
    <a class="brand brand--image" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='lilla-kulturklubben-logo-320px.webp') }}" alt="Lilla kulturklubben – startsida" width="320" height="180"></a>
    {% if club_member %}
    <form action="{{ url_for('club.logout') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ logout_csrf }}">
      <button type="submit" class="filter-button button--small header-logout">Logga ut</button>
    </form>
    {% endif %}
  </div>
  <div class="header-right">
    <nav aria-label="Huvudmeny">
      <a href="{{ url_for('home') }}#evenemang">Evenemang</a>
      <a class="club-nav" href="{{ url_for('club.index') }}"{% if request.endpoint == 'club.index' %} aria-current="page"{% endif %}>Klubben <span aria-hidden="true">↗</span></a>
    </nav>
    {% if club_member %}
    <div class="header-account">
      <span class="header-status" title="Inloggad: {{ club_member.name }} ({{ club_member.email }})"><span class="status-dot" aria-hidden="true"></span><span class="header-status-text">Inloggad: <span class="header-name">{{ club_member.name }}</span></span></span>
    </div>
    {% endif %}
  </div>
</header>
